# Daily: scrape every shop, merge Reddit posts, append price history, deploy to GitHub Pages.
name: Update prices
on:
  schedule:
    - cron: '17 9 * * *'   # daily, 09:17 UTC
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the site (untick for a dry run that only scrapes + builds)
        type: boolean
        default: true

permissions:
  contents: write   # commit data/history.json
  pages: write
  id-token: write

concurrency:
  group: data        # shared with reddit.yml so they never push at the same time
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Yesterday's offers stand in for any shop that fails today (see STALE_DAYS in scrape.js).
      - uses: actions/cache@v4
        with:
          path: build/offers.json
          key: offers-${{ github.run_id }}
          restore-keys: offers-
      - run: node scripts/scrape.js 2>&1 | tee scrape.log
      - run: node scripts/build.js
      - name: Summary
        run: |
          node -e "const i=require('./public/data/index.json');console.log('fragrances',i.rows.length)" >> $GITHUB_STEP_SUMMARY
          grep -E 'offers|FAILED|skipped' scrape.log >> $GITHUB_STEP_SUMMARY || true
      - uses: actions/upload-artifact@v4
        with:
          name: scrape-${{ github.run_id }}
          path: |
            build/offers.json
            scrape.log
          retention-days: 7
      - name: Commit price history
        if: github.event_name == 'schedule' || inputs.deploy
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "Price history $(date -u +%F)"
          git pull --rebase && git push
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'schedule' || inputs.deploy
        with: { path: public }
      - id: deploy
        if: github.event_name == 'schedule' || inputs.deploy
        uses: actions/deploy-pages@v4

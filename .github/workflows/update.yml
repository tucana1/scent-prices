# Daily: scrape every shop, merge Reddit posts, append price history, deploy to GitHub Pages.
name: Update prices
on:
  schedule:
    - cron: '17 9 * * *'   # daily, 09:17 UTC
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the site (untick for a dry run that only scrapes + builds)
        type: boolean
        default: true
      scrape:
        description: Scrape the shops (untick to rebuild from the last scrape, e.g. after a Reddit import)
        type: boolean
        default: true

permissions:
  contents: write   # commit data/history.json
  pages: write
  id-token: write

concurrency:
  group: data        # shared with reddit.yml so they never push at the same time
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      # Yesterday's offers stand in for any shop that fails today (see STALE_DAYS in scrape.js).
      # MaxAroma's rotating crawl also needs to remember which pages it checked when.
      # (Changing this path list changes the cache's identity and loses the saved offers.)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/offers.json
            build/jsonld-state.json
          key: offers-${{ github.run_id }}
          restore-keys: offers-
      # Each shop listing's price over the last 30 days, for the Deals page.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/listing-prices.json
          key: listing-prices-${{ github.run_id }}
          restore-keys: listing-prices-
      - run: node scripts/scrape.js 2>&1 | tee scrape.log
        if: github.event_name == 'schedule' || inputs.scrape
      - run: node scripts/build.js
      - name: Summary
        run: |
          node -e "const i=require('./public/data/index.json');console.log('fragrances',i.rows.length)" >> $GITHUB_STEP_SUMMARY
          grep -E 'offers|FAILED|skipped' scrape.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scrape-${{ github.run_id }}
          path: |
            build/offers.json
            build/jsonld-state.json
            build/listing-prices.json
            scrape.log
          retention-days: 7
      - name: Commit price history
        if: github.event_name == 'schedule' || inputs.deploy
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "Price history $(date -u +%F)"
          git pull --rebase && git push
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name == 'schedule' || inputs.deploy
        with: { path: public }
      - id: deploy
        if: github.event_name == 'schedule' || inputs.deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
